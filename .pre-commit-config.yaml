repos:
- repo: local
  hooks:
    - id: format
      name: format
      entry: make format
      language: system
      types: [python]
    - id: lint
      name: lint
      entry: make lint
      language: system
    - id: test
      name: test
      entry: make test
      language: system
    - id: docker-build
      name: docker-build
      entry: make docker-build
      language: system
      types: [dockerfile]
